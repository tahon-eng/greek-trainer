<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя грецька · Картки та тести</title>
<style>
:root{--ink:#203e3c;--green:#256c5a;--paper:#fbf8f1;--muted:#647873;--line:#dce5dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #db9a36;outline-offset:4px}main{max-width:920px;margin:auto;padding:34px 20px 50px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--green)}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-2px;margin:8px 0}p{line-height:1.6}.subtitle{color:var(--muted);margin:0 0 24px}.badge{border:1px solid var(--line);padding:9px 13px;border-radius:30px;font-size:12px;white-space:nowrap}.tabs,.modes,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;border-radius:14px;padding:12px 17px}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:26px 0 16px}.modes{background:#e9eee5;padding:5px;border-radius:13px}.modes button{border:0;background:transparent;padding:9px 14px;border-radius:9px}.modes button.active{background:white;box-shadow:0 2px 6px #203e3c12}.counter{font-size:14px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 12px 36px #203e3c07}.topic{font-size:13px;color:var(--muted)}.flash{width:100%;min-height:245px;border:0;background:#f0f5ed;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;margin:20px 0;color:var(--ink)}.word{font-size:clamp(29px,6vw,44px);font-weight:700;line-height:1.3}.hint{font-size:14px;color:var(--muted);margin-top:18px}.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:12px 22px}.secondary{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 18px}.actions{justify-content:center}.question{text-align:center;margin:28px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:70px;text-align:left;background:white;border:2px solid var(--line);border-radius:14px;padding:16px}.option:hover:not(:disabled){border-color:var(--green);background:#f3f7f0}.option.correct{background:#e4f3e9;border-color:#388259}.option.wrong{background:#fff0ed;border-color:#c77767}.option:disabled{cursor:default;opacity:1}.feedback{min-height:52px;margin:18px 0 8px;line-height:1.5}.progress{height:6px;background:#e9eee5;border-radius:10px;overflow:hidden;margin-top:16px}.progress span{display:block;background:var(--green);height:100%;transition:width .25s}.note{font-size:13px;color:var(--muted);margin:22px 2px}.results{text-align:center;padding:28px 0}.results strong{font-size:58px;display:block}.vocab{margin-top:24px;border:1px solid var(--line);border-radius:16px;padding:17px;background:#ffffff80}summary{cursor:pointer;font-weight:600}.list{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:14px}.entry{padding:12px 0;border-bottom:1px solid var(--line)}.entry span{display:block;color:var(--muted);font-size:14px;margin-top:4px}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}@media(max-width:560px){main{padding:24px 14px}header{align-items:start}.badge{font-size:10px;padding:8px}.panel{padding:20px 16px}.tabs button{flex:1;padding:11px 8px;font-size:14px}.toolbar{align-items:start;flex-direction:column;gap:10px}.options,.list{grid-template-columns:1fr}.flash{min-height:230px}.option{min-height:60px}}
.word{overflow-wrap:anywhere}.tabs button{white-space:nowrap}@media(max-width:560px){.tabs button{flex:1 1 calc(50% - 8px)}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">МАЛЕНЬКІ КРОКИ · ЩОДНЯ</div><h1>Моя грецька</h1></div><span class="badge">● Працює офлайн</span></header>
<p class="subtitle">Вивчай слова, перевертай картки та перевіряй себе.</p>
<nav class="tabs" aria-label="Теми" id="themes"></nav>
<div class="toolbar"><div class="modes" aria-label="Режим навчання"><button id="cardsMode" class="active" type="button">▣ Картки</button><button id="quizMode" type="button">✦ Тест</button></div><div class="counter" id="counter"></div></div>
<section class="panel" id="stage" aria-label="Навчання"></section>
<p class="note" id="note"></p>
<details class="vocab"><summary>Усі слова цієї теми</summary><div class="list" id="vocabulary"></div></details>
<div class="footer">Без інтернету · Без акаунтів · Один файл<br>Картки: ← → для переходу, пробіл для перевертання.</div>
</main>
<script>
'use strict';
const themes=[
{id:'fridge',label:'🧊 Ψυγείο',title:'Ψυγείο · Холодильник',note:'Усі 24 слова з твого списку. Тут є й продукти, які зазвичай зберігають у шафі. Лούντζα — кіпрський м’ясний продукт.',words:[['το γάλα','молоко'],['το αυγό','яйце'],['τα αυγά','яйця'],['το τυρί','сир'],['το βούτυρο','вершкове масло'],['το κοτόπουλο','курятина / курка'],['το λουκάνικο','ковбаска / сосиска'],['η λούντζα','лундза (копчена свиняча корейка)'],['το ψάρι','риба'],['το μήλο','яблуко'],['το ροδάκινο','персик'],['το λεμόνι','лимон'],['το πορτοκάλι','апельсин'],['το ραπανάκι','редиска'],['η σάλτσα','соус'],['το ρύζι','рис'],['το φαγόπυρο','гречка'],['η κινόα','кіноа'],['τα σπαγγέτι','спагеті'],['τα μακαρόνια','макарони'],['το μούσλι','мюслі'],['το αναψυκτικό','прохолодний безалкогольний напій'],['ο σπόρος','насінина'],['ο ηλιόσπορος','насінина соняшника']]},
{id:'fruit',label:'🍎 Фрукти',title:'Φρούτα · Фрукти',note:'Чотири назви фруктів із твого списку. Запам’ятовуй слово разом з артиклем.',words:[['το μήλο','яблуко'],['το ροδάκινο','персик'],['το λεμόνι','лимон'],['το πορτοκάλι','апельсин']]},
{id:'profile',label:'📝 Анкета',title:'Προσωπικά στοιχεία · Особисті дані',note:'Додаткова базова лексика для заповнення анкети.',words:[['το όνομα','ім’я'],['το επώνυμο','прізвище'],['η ηλικία','вік'],['η χώρα','країна'],['η πόλη','місто'],['η διεύθυνση','адреса'],['το τηλέφωνο','телефон'],['το επάγγελμα','професія'],['η ημερομηνία γέννησης','дата народження'],['η εθνικότητα','національність']]},
{id:'numbers',label:'🔢 Числа',title:'Αριθμοί · Числа до 100',note:'1–10, потім 20, 30, 40 … 100. Один: ένας — чоловічий рід, μία (μια) — жіночий, ένα — середній. Для 3 і 4: τρεις / τέσσερις — чоловічий і жіночий рід, τρία / τέσσερα — середній. Форми через / — варіанти одного числа.',words:[['ένας / μία (μια) / ένα','1 — один / одна / одне'],['δύο / δυο','2 — два / дві'],['τρεις / τρία','3 — три'],['τέσσερις / τέσσερα','4 — чотири'],['πέντε','5 — п’ять'],['έξι','6 — шість'],['επτά / εφτά','7 — сім'],['οκτώ / οχτώ','8 — вісім'],['εννέα / εννιά','9 — дев’ять'],['δέκα','10 — десять'],['είκοσι','20 — двадцять'],['τριάντα','30 — тридцять'],['σαράντα','40 — сорок'],['πενήντα','50 — п’ятдесят'],['εξήντα','60 — шістдесят'],['εβδομήντα','70 — сімдесят'],['ογδόντα','80 — вісімдесят'],['ενενήντα','90 — дев’яносто'],['εκατό','100 — сто']]},
{id:'weekdays',label:'📅 Дні тижня',title:'Ημέρες της εβδομάδας · Дні тижня',note:'Сім днів від понеділка до неділі. Усі назви мають жіночий рід, крім το Σάββατο — середній рід.',words:[['η Δευτέρα','понеділок'],['η Τρίτη','вівторок'],['η Τετάρτη','середа'],['η Πέμπτη','четвер'],['η Παρασκευή','п’ятниця'],['το Σάββατο','субота'],['η Κυριακή','неділя']]},
{id:'questions',label:'❔ Питальні слова',title:'Ερωτηματικές λέξεις · Питальні слова',note:'',words:[['Ποιος','хто? / який? (чоловічий рід, однина)'],['Τι','що?'],['Πού','де? / куди?'],['Πότε','коли?'],['Πώς','як?'],['Γιατί','чому?'],['Πόσο','скільки? / наскільки?'],['Ποιο','яке? (середній рід, однина)'],['Ποια','хто? / яка? (жіночий рід, однина)','Жіночий рід, однина'],['Ποια','які? (середній рід, множина)','Середній рід, множина'],['Ποιοι','хто? / які? (чоловічий рід, множина)'],['Ποιες','хто? / які? (жіночий рід, множина)'],['Από πού','звідки?'],['Σε ποια','у яку? / в якій? (жіночий рід)']]},
{id:'verbs',label:'💬 Важливі дієслова',title:'Σημαντικά ρήματα · Важливі дієслова',note:'30 дієслів із твого списку. Грецькі форми подано в першій особі однини теперішнього часу: έχω — я маю. Український переклад на картках подано в початковій формі: мати.',words:[['είμαι','бути'],['έχω','мати'],['μένω','жити / залишатися'],['δουλεύω','працювати'],['κάνω','робити'],['πηγαίνω','йти / їхати'],['έρχομαι','приходити / приїжджати'],['τρώω','їсти'],['πίνω','пити'],['διαβάζω','читати'],['γράφω','писати'],['μιλάω / μιλώ','говорити'],['λέω','казати'],['ακούω','слухати / чути'],['βλέπω','бачити'],['θέλω','хотіти'],['μπορώ','могти'],['ξέρω','знати'],['καταλαβαίνω','розуміти'],['ρωτάω','питати'],['απαντάω','відповідати'],['αγοράζω','купувати'],['πληρώνω','платити'],['παίρνω','брати / отримувати'],['δίνω','давати'],['ανοίγω','відкривати'],['κλείνω','закривати'],['μαθαίνω','вивчати / дізнаватися'],['βρίσκω','знаходити'],['αγαπάω','любити']]},
{"id":"directions","label":"🧭 Напрямки","title":"Τοποθεσία · Напрямки та розташування","note":"","words":[["κοντά στο","близько до"],["μακριά από","далеко від"],["αριστερά από","ліворуч від"],["δεξιά από","праворуч від"],["μπροστά από","перед"],["πίσω από","позаду / за"],["κάτω από","під"],["πάνω σε","на (поверхні)"],["μέσα σε","у / в (усередині)"],["ανάμεσα σε","між"],["δίπλα σε","поруч із"],["πάνω από","над"],["έξω από","поза / зовні"]]},
{"id":"street","label":"🏙️ Об’єкти на вулиці","title":"Στην πόλη · Об’єкти на вулиці","note":"","words":[["το ταχυδρομείο","пошта"],["το φαρμακείο","аптека"],["η τράπεζα","банк"],["το θέατρο","театр"],["το σπίτι","дім / будинок"],["το ξενοδοχείο","готель"],["το σχολείο","школа"],["το πανεπιστήμιο","університет"],["η στάση λεωφορείου","автобусна зупинка"],["το πάρκο","парк"],["το αεροδρόμιο","аеропорт"],["το λιμάνι","порт"],["το βενζινάδικο","заправка / АЗС"],["το νοσοκομείο","лікарня"],["το γήπεδο","стадіон / спортивний майданчик"],["το μουσείο","музей"],["η καφετέρια","кафе / кав’ярня"],["ο κινηματογράφος","кінотеатр"],["η πλατεία","площа"]]}
];
let theme=themes[0],mode='cards',index=0,flipped=false,order=[],answered=false,correct=0,missed=[],direction=0,cardDirection=0;
const $=id=>document.getElementById(id);
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function button(text,cls,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;b.onclick=action;return b}
function start(){index=0;flipped=false;answered=false;correct=0;missed=[];order=mode==='quiz'?shuffle(theme.words):theme.words.slice();render()}
function switchMode(m){mode=m;start()}
$('cardsMode').onclick=()=>switchMode('cards');$('quizMode').onclick=()=>switchMode('quiz');
themes.forEach(t=>{$('themes').append(button(t.label,'',()=>{theme=t;start()}))});
function render(){
 [...$('themes').children].forEach((b,i)=>{const active=themes[i]===theme;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});
 ['cards','quiz'].forEach(m=>{$(m+'Mode').classList.toggle('active',mode===m);$(m+'Mode').setAttribute('aria-pressed',mode===m)});
 $('note').textContent=theme.note;$('note').hidden=!theme.note;$('vocabulary').replaceChildren();theme.words.forEach(w=>{const d=document.createElement('div');d.className='entry';const g=document.createElement('strong');g.lang='el';g.textContent=w[0];const u=document.createElement('span');u.textContent=w[1];d.append(g,u);$('vocabulary').append(d)});
 const stage=$('stage');stage.replaceChildren();const title=document.createElement('div');title.className='topic';title.textContent=theme.title;stage.append(title);
 if(index>=order.length&&mode==='quiz'){renderResults();return}
 $('counter').textContent=mode==='cards'?`${index+1} / ${order.length} карток`:`${index+1} / ${order.length} · Правильно: ${correct}`;
 mode==='cards'?renderCard():renderQuiz();
}
function renderCard(){
 const stage=$('stage'),w=order[index];
 const controls=document.createElement('div');controls.className='actions';controls.style.marginTop='18px';
 controls.append(button(cardDirection===0?'⇄ Змінити на українська → грецька':'⇄ Змінити на грецька → українська','secondary',()=>{cardDirection=1-cardDirection;flipped=false;render()}));stage.append(controls);
 const side=flipped?1-cardDirection:cardDirection;
 const card=button('','flash',()=>{flipped=!flipped;render()});card.setAttribute('aria-label','Перевернути картку');
 const word=document.createElement('span');word.className='word';word.textContent=w[side];word.lang=side===0?'el':'uk';
 const hint=document.createElement('span');hint.className='hint';hint.textContent=flipped?`${side===0?'Грецький':'Український'} переклад · натисни, щоб повернутись`:`Натисни на картку, щоб побачити ${side===0?'український':'грецький'} переклад`;
 if(side===0&&w[2])hint.textContent=w[2]+' · '+hint.textContent;
 card.append(word,hint);stage.append(card);
 const a=document.createElement('div');a.className='actions';a.append(button('← Назад','secondary',()=>move(-1)),button('Перевернути','primary',()=>{flipped=!flipped;render()}),button('Далі →','secondary',()=>move(1)));stage.append(a)
}
function move(step){index=(index+step+order.length)%order.length;flipped=false;render()}
function renderQuiz(){const stage=$('stage');const controls=document.createElement('div');controls.className='actions';controls.style.marginTop='18px';controls.append(button(direction===0?'Грецька → українська ⇄':'Українська → грецька ⇄','secondary',()=>{direction=1-direction;start()}));stage.append(controls);
 const w=order[index],target=1-direction;const q=document.createElement('div');q.className='question';const hint=document.createElement('div');hint.className='hint';hint.textContent='Обери правильний переклад'+(direction===0&&w[2]?' · '+w[2]:'');const word=document.createElement('div');word.className='word';word.lang=direction===0?'el':'uk';word.textContent=w[direction];q.append(hint,word);stage.append(q);
 const grid=document.createElement('div');grid.className='options';const distractors=[...new Map(shuffle(theme.words.filter(x=>x[target]!==w[target])).map(x=>[x[target],x])).values()].slice(0,3);const candidates=shuffle([w,...distractors]);const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('role','status');const next=button('Наступне слово →','primary',()=>{index++;answered=false;render()});next.hidden=true;
 candidates.forEach(c=>{const b=button(c[target],'option',()=>{if(answered)return;answered=true;const ok=c===w;if(ok)correct++;else missed.push(w);[...grid.children].forEach((item,i)=>{item.disabled=true;if(candidates[i]===w)item.classList.add('correct')});if(!ok)b.classList.add('wrong');feedback.textContent=ok?'✓ Правильно!':`Правильна відповідь: ${w[target]}`;next.hidden=false;next.textContent=index===order.length-1?'Показати результат →':'Наступне слово →';$('counter').textContent=`${index+1} / ${order.length} · Правильно: ${correct}`});b.lang=target===0?'el':'uk';grid.append(b)});stage.append(grid,feedback,next);const progress=document.createElement('div');progress.className='progress';const bar=document.createElement('span');bar.style.width=`${index/order.length*100}%`;progress.append(bar);stage.append(progress)}
function renderResults(){const stage=$('stage');$('counter').textContent='Тест завершено';const r=document.createElement('div');r.className='results';const score=document.createElement('strong');score.textContent=`${correct} / ${order.length}`;const p=document.createElement('p');p.textContent=missed.length?'Ще трохи практики — і ці слова запам’ятаються.':'Усі відповіді правильні. Чудова робота!';r.append(score,p);const a=document.createElement('div');a.className='actions';a.append(button('Пройти ще раз','primary',start),button('До карток','secondary',()=>switchMode('cards')));if(missed.length){const retry=missed.slice();a.append(button(`Повторити помилки (${retry.length})`,'secondary',()=>{order=shuffle(retry);index=0;correct=0;missed=[];answered=false;render()}));const list=document.createElement('div');list.className='list';retry.forEach(w=>{const item=document.createElement('div');item.className='entry';item.textContent=w[0]+' — '+w[1];list.append(item)});r.append(list)}stage.append(r,a)}
document.addEventListener('keydown',e=>{if(mode!=='cards'||e.target.closest('button,summary,input,select,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'){e.preventDefault();flipped=!flipped;render()}});
start();
</script></body></html>
